name: Generate Snake

# Quando este workflow roda
on:
  schedule:
    # Atualiza a cada 12 horas (00:00 e 12:00 UTC)
    - cron: "0 */12 * * *"
  # Permite rodar na mão pela aba Actions (ótimo para testar)
  workflow_dispatch:
  # Roda também a cada push na main (mantém a cobrinha sempre fresca)
  push:
    branches:
      - main

# Permissão necessária para publicar o SVG/GIF no branch "output"
permissions:
  contents: write

jobs:
  generate:
    name: Gerar cobrinha de contribuicoes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gera o SVG (tema claro + escuro) e o GIF a partir do grid de contribuicoes
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # Publica os arquivos gerados no branch "output"
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
